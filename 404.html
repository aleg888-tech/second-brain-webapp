    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; frame-src 'self' https://accounts.google.com; connect-src 'self' https: https://api.github.com https://www.googleapis.com https://accounts.google.com https://oauth2.googleapis.com https://api.microlink.io https://noembed.com https://dashscope-intl.aliyuncs.com https://dashscope-us.aliyuncs.com https://dashscope.aliyuncs.com https://eu-central-1.maas.qwencloudapi.com http://127.0.0.1:* http://localhost:*; object-src 'none'; base-uri 'self';">
    <meta name="referrer" content="no-referrer">
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
    <title>Caricamento...</title>
    <script>
      (function() {
        var l = window.location;
        var pathname = l.pathname;
        var segments = pathname.split('/').filter(Boolean);
        var isGitHubPages = l.hostname.endsWith('github.io');
        var isSubfolder = (segments.length > 0 && segments[0] === 'second-brain-webapp') ||
                          (isGitHubPages && segments.length > 1 && !segments[0].includes('.'));
        var keepCount = isSubfolder ? 1 : 0;
        var repoBase = isSubfolder ? '/' + segments[0] : '';
        var routePath = segments.slice(keepCount).join('/');
        var search = l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '';
        var targetUrl = l.protocol + '//' + l.host + repoBase + '/?/' + encodeURI(routePath) + search + l.hash;
        l.replace(targetUrl);
      })();
    </script>
  </head>

</html>
